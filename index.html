<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jshti Office</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: #333;
            background: linear-gradient(135deg, #142469 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            max-width: 600px;
            width: 100%;
        }

        .header {
            background: linear-gradient(135deg, #061245 0%, #764ba2 100%);
            color: white;
            padding: 60px 40px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 15px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.95;
            font-weight: 300;
        }

        .content {
            padding: 60px 40px;
            text-align: center;
        }

        .contact-info {
            background: #f8f9fa;
            padding: 30px;
            border-radius: 15px;
            margin: 30px 0;
        }

        .contact-info p {
            font-size: 1rem;
            margin-bottom: 15px;
            color: #555;
        }

        .phone-number {
            font-size: 1.5rem;
            font-weight: 700;
            color: #02092a;
            margin: 15px 0;
            letter-spacing: 1px;
        }

        .image-container {
            margin: 40px 0;
            text-align: center;
        }

        .image-container img {
            max-width: 100%;
            height: auto;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            transition: transform 0.3s ease;
        }

        .image-container img:hover {
            transform: scale(1.05);
        }

        .social-links {
            margin-top: 40px;
            padding-top: 30px;
            border-top: 2px solid #e9ecef;
        }

        .social-links a {
            display: inline-block;
            background: linear-gradient(135deg, #000519 0%, #764ba2 100%);
            color: white;
            padding: 12px 40px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        .social-links a:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }

        .social-links a:active {
            transform: translateY(0);
        }

        @media (max-width: 480px) {
            .header h1 {
                font-size: 1.8rem;
            }

            .header {
                padding: 40px 30px;
            }

            .content {
                padding: 40px 30px;
            }

            .phone-number {
                font-size: 1.2rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Ունեք Խնդիրներ Եվ Դուք Ճիշտ եք?</h1>
            <p>Զանգահարեք Ճշտի Օֆֆիս</p>
        </div>

        <div class="content">
            <div class="contact-info">
                <p>Կապ հաստեղծել մեզ հետ</p>
                <div class="phone-number">
                    <a href="tel:+37499457447" style="color: #667eea; text-decoration: none;">099 45 74 47</a>
                </div>
            </div>

            <div class="image-container">
                <img src="Jshti Office.png" alt="Jshti Office">
            </div>
            <p>Ճշտի Օֆֆիս, միշտ Ճշտի կողմում ենք մենք</p>

            <div class="social-links">
                <a href="https://www.instagram.com/_ara_mamikonyan/" target="_blank">Follow on Instagram</a>
            </div>
        </div>
    </div>
</body>
</html>
